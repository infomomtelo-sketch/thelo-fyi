<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Referral</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-white/10 bg-slate-950/90">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-4">
      <div class="flex items-center gap-4">
        <a href="/" aria-label="Return to the homepage" class="inline-flex items-center gap-2 rounded-full border border-white/15 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:bg-white/10 hover:text-white">&larr; Back home</a>
        <a href="/" class="text-lg font-semibold tracking-tight">thelo.fyi</a>
      </div>
      <nav class="flex gap-4 text-sm text-slate-300">
        <a href="/create" aria-current="page" class="text-white">Create</a>
        <a href="/map" class="hover:text-white">Map</a>
        <a href="/app/" class="hover:text-white">Floor Plan</a>
        <a href="/agent/" class="hover:text-white">Agent Access</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-3xl items-center px-6 py-12">
    <section class="w-full rounded-[2rem] border border-white/10 bg-white/5 p-8">
      <p class="text-sm uppercase tracking-[0.2em] text-slate-400">Create referral page</p>
      <h1 class="mt-3 text-4xl font-black text-white">Start your Thelo listing</h1>
      <form id="createForm" class="mt-8 space-y-5">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-200">Facility name</span>
          <input id="name" required class="w-full rounded-2xl border border-white/10 bg-slate-900 px-4 py-3 text-white" placeholder="Fresno Garden House">
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-200">Slug preview</span>
          <input id="slug" required class="w-full rounded-2xl border border-white/10 bg-slate-900 px-4 py-3 text-white" placeholder="fresno-garden-house">
          <p class="mt-2 text-sm text-slate-400">Preview: <span id="preview">thelo.fyi/r/fresno-garden-house</span></p>
        </label>
        <div class="grid gap-4 md:grid-cols-2">
          <label class="block">
            <span class="mb-2 block text-sm font-medium text-slate-200">Beds</span>
            <input id="beds" type="number" min="1" required class="w-full rounded-2xl border border-white/10 bg-slate-900 px-4 py-3 text-white" placeholder="6">
          </label>
          <label class="block">
            <span class="mb-2 block text-sm font-medium text-slate-200">Price</span>
            <input id="price" type="number" min="0" required class="w-full rounded-2xl border border-white/10 bg-slate-900 px-4 py-3 text-white" placeholder="3500">
          </label>
        </div>
        <button type="submit" class="rounded-full bg-emerald-400 px-8 py-4 text-sm font-bold text-slate-950">Go to Floor Plan App</button>
      </form>
    </section>
  </main>

  <script>
    const nameInput = document.getElementById("name");
    const slugInput = document.getElementById("slug");
    const preview = document.getElementById("preview");

    function slugify(value) {
      return value.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function updatePreview() {
      const slug = slugify(slugInput.value || nameInput.value);
      slugInput.value = slug;
      preview.textContent = `thelo.fyi/r/${slug || "your-slug"}`;
    }

    nameInput.addEventListener("input", updatePreview);
    slugInput.addEventListener("input", updatePreview);

    document.getElementById("createForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const slug = slugify(slugInput.value || nameInput.value);
      const beds = document.getElementById("beds").value;
      const price = document.getElementById("price").value;
      const url = new URL("/app/", window.location.origin);
      url.searchParams.set("create", slug);
      url.searchParams.set("beds", beds);
      url.searchParams.set("price", price);
      window.location.href = url.toString();
    });

    updatePreview();
  </script>
</body>
</html>
