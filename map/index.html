<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>thelo.fyi - Find Care in Fresno</title>
<meta property="og:title" content="thelo.fyi - Find Care in Fresno" />
<meta property="og:description" content="10 verified facilities. Real beds, real phone numbers. Verified compliance." />
<meta property="og:image" content="https://thelo.fyi/map/og-image.jpg" />
<meta property="og:url" content="https://thelo.fyi/map/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://thelo.fyi/map/og-image.jpg" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; }
  #map { height: 100vh; width: 100%; }
  .header { position:absolute; top:0; left:0; right:0; z-index:1000; background:white; padding:12px 16px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="header">
  <b>thelo.fyi</b> - 10 verified facilities in Fresno | Title 22 Score by title-22.com
</div>
<div id="map"></div>
<script>
const map = L.map('map').setView([36.77, -119.71], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

fetch('/map/facilities.json')
  .then(r => r.json())
  .then(facilities => {
    facilities.forEach(f => {
      L.marker([f.lat, f.lng]).addTo(map).bindPopup(`<b>${f.name}</b><br>${f.address}`);
    });
  });
</script>
</body>
</html>
