<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lo - Facility Map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  #map { height: 100vh; }
  #facilityList { max-height: 100vh; overflow-y: auto; }
</style>
</head>
<body class="bg-gray-900 text-white flex">

<!-- LIST -->
<div class="w-full md:w-96 p-4 bg-gray-900 z-10 overflow-hidden flex flex-col">
  <h1 class="font-bold text-xl mb-4">Fresno Care Facilities</h1>
  <div id="facilityList" class="flex-1">Loading...</div>
</div>

<!-- MAP -->
<div id="map" class="flex-1"></div>

<!-- MODAL - must be in DOM with these IDs -->
<div id="facilityModal" class="hidden fixed inset-0 z-[9999] bg-black/60 flex items-center justify-center p-4">
  <div class="bg-gray-800 rounded-2xl p-6 w-full max-w-md border border-gray-700">
    <div class="flex justify-between items-center">
      <h2 id="modalName" class="font-bold text-white text-lg">FACILITY DETAILS</h2>
      <button onclick="closeModal()" class="text-gray-400 hover:text-white px-2">Close</button>
    </div>
    <div class="mt-4 text-sm text-gray-300 space-y-2">
      <div>Address: <span id="modalAddress" class="text-white"></span></div>
      <div>Beds available: <span id="modalBeds" class="text-white font-bold"></span></div>
      <div>Care level: <span id="modalCare"></span></div>
      <div>Phone: <span id="modalPhone"></span></div>
      <div class="text-xs text-gray-500">Last updated: <span id="modalUpdated"></span></div>
    </div>
    <a id="callBtn" href="#" class="mt-6 inline-block bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold">Call Facility</a>
  </div>
</div>

<script>
window.facilities = [];
let map;
let markers = [];

function initMap() {
  map = L.map('map').setView([36.7378, -119.7871], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function renderMarkers(list) {
  if (!map) initMap();
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  list.forEach(f => {
    if (!f.lat ||!f.lng) return;
    const m = L.marker([f.lat, f.lng]).addTo(map);
    m.on('click', () => window.openFacility(f.id));
    markers.push(m);
  });
}

function renderCards(list) {
  const el = document.getElementById('facilityList');
  if (!list.length) {
    el.innerHTML = '<div class="text-gray-400 text-sm">No facilities found</div>';
    return;
  }
  el.innerHTML = list.map(f => `
    <div onclick="window.openFacility('${f.id}')" class="cursor-pointer pointer-events-auto p-4 rounded-xl bg-gray-800 hover:bg-gray-700 border border-gray-700 mb-3 transition">
      <div class="font-bold text-white">${f.name || 'Unnamed Facility'}</div>
      <div class="text-xs text-gray-400 truncate">${f.address || ''}</div>
      <div class="mt-2 text-sm">
        <span class="px-2 py-1 rounded-full ${f.beds_available>0?'bg-green-500':'bg-gray-600'} text-white text-xs">
          ${f.beds_available>0? f.beds_available + ' Beds' : 'Full'}
        </span>
        <span class="ml-2 text-gray-400 text-xs">${f.care_level || ''}</span>
      </div>
      <div class="text-xs mt-1 text-gray-500">${f.phone || ''}</div>
    </div>
  `).join('');
}

window.openFacility = function(id) {
  console.log('openFacility', id, window.facilities.length);
  const f = window.facilities.find(x => String(x.id) === String(id) || x.slug === id);
  if (!f) {
    console.error('facility not found', id);
    return;
  }
  document.getElementById('modalName').innerText = f.name || 'Unnamed Facility';
  document.getElementById('modalAddress').innerText = f.address || '';
  document.getElementById('modalBeds').innerText = f.beds_available?? '0';
  document.getElementById('modalCare').innerText = f.care_level || '';
  document.getElementById('modalPhone').innerText = f.phone || 'No phone listed';
  document.getElementById('modalUpdated').innerText = f.last_updated || new Date().toISOString().split('T')[0];

  const callBtn = document.getElementById('callBtn');
  if (f.phone && f.phone.trim()) {
    callBtn.href = `tel:${f.phone}`;
    callBtn.classList.remove('opacity-50','pointer-events-none');
    callBtn.innerText = 'Call Facility';
  } else {
    callBtn.href = 'javascript:void(0)';
    callBtn.classList.add('opacity-50','pointer-events-none');
    callBtn.innerText = 'No phone listed';
  }

  document.getElementById('facilityModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('facilityModal').classList.add('hidden');
}

async function loadFacilities() {
  try {
    const res = await fetch('https://thelo.fyi/api/facilities');
    const data = await res.json();
    window.facilities = data.facilities || data || [];
    console.log('loaded', window.facilities.length);
    renderCards(window.facilities);
    renderMarkers(window.facilities);
  } catch(e) {
    console.error(e);
    document.getElementById('facilityList').innerHTML = '<div class="text-red-400 text-sm">Failed to load</div>';
  }
}

initMap();
loadFacilities();

// close modal on background click
document.getElementById('facilityModal').addEventListener('click', (e) => {
  if (e.target.id === 'facilityModal') closeModal();
});
</script>
</body>
</html>
