<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thelo Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <a href="/" style="position:fixed;top:16px;left:16px;z-index:99999;background:#2563eb;color:white;padding:8px 16px;border-radius:999px;text-decoration:none;font-family:system-ui;font-weight:600;box-shadow:0 8px 24px rgba(37,99,235,0.35)">← Home</a>
  <div style="height:56px"></div>
  <div class="bg-amber-300 px-6 py-3 text-center text-sm font-black text-slate-950">For Agents $99/mo</div>
  <main class="mx-auto max-w-7xl px-6 py-8">
    <div class="mb-6 flex items-center justify-between gap-4">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-slate-400">Live availability</p>
        <h1 class="mt-2 text-3xl font-black text-white">Fresno facility map</h1>
      </div>
      <a href="/agent/" class="rounded-full border border-white/10 px-4 py-2 text-sm font-semibold text-slate-200">Get Agent Access</a>
    </div>
    <div class="grid gap-6 lg:grid-cols-[320px,1fr]">
      <aside class="rounded-3xl border border-white/10 bg-white/5 p-4">
        <div id="facilityList" class="space-y-4"></div>
      </aside>
      <section class="overflow-hidden rounded-3xl border border-white/10">
        <div id="map" class="h-[70vh] w-full" style="pointer-events:auto"></div>
      </section>
    </div>
  </main>

  <footer class="border-t border-white/10 px-6 py-8 text-center text-xs text-slate-500">
    © 2026 thelo.fyi • A product of EC Rental Property Management LLC
    <span class="mx-2">•</span><a href="/privacy/" class="hover:text-slate-300">Privacy</a>
    <span class="mx-2">•</span><a href="/terms/" class="hover:text-slate-300">Terms</a>
    <span class="mx-2">•</span><a href="/disclaimer/" class="hover:text-slate-300">Disclaimer</a>
  </footer>

  <div id="facilityModal" class="hidden fixed inset-0 z-50 px-4 pb-4 lg:inset-0 lg:flex lg:items-center lg:justify-center" aria-hidden="true">
    <div class="w-full max-w-xl rounded-t-3xl border border-white/10 bg-slate-950 p-5 shadow-2xl lg:rounded-3xl" role="dialog" aria-modal="true">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Facility details</p>
          <h2 id="modalName" class="mt-1 text-2xl font-black text-white"></h2>
        </div>
        <button id="closeFacilityModal" type="button" class="rounded-full border border-white/10 px-3 py-2 text-sm font-semibold text-slate-200">Close</button>
      </div>
      <div class="mt-4 space-y-3 text-sm text-slate-200">
        <p><span class="text-slate-400">Address:</span> <span id="modalAddress"></span></p>
        <p><span class="text-slate-400">Beds available:</span> <span id="modalBeds"></span></p>
        <p><span class="text-slate-400">Care level:</span> <span id="modalCare"></span></p>
        <p><span class="text-slate-400">Phone:</span> <a id="modalPhone" class="text-sky-300 underline" href="#"></a></p>
        <p><span class="text-slate-400">Last updated:</span> <span id="modalUpdated"></span></p>
      </div>
      <div class="mt-5 flex flex-col gap-3 sm:flex-row">
        <a id="callBtn" href="#" class="inline-flex items-center justify-center rounded-full bg-emerald-400 px-4 py-3 text-sm font-bold text-slate-950">Call Facility</a>
      </div>
    </div>
  </div>

  <script>
    window.facilities = [];
    const FACILITIES_API_URLS = ["https://thelo.fyi/api/facilities", "/api/facilities"];

    const demoFacilities = [
      { id: 1, name: "Fresno Garden House", address: "1234 N Cedar Ave, Fresno, CA 93703", beds_available: 2, care_level: "RCFE", phone: "(559) 555-0101", last_updated: "2026-09-10T00:00:00Z", lat: 36.7378, lng: -119.7871, slug: "fresno-garden-house" },
      { id: 2, name: "Fig Garden Care", address: "4567 W Shaw Ave, Fresno, CA 93711", beds_available: 0, care_level: "RCFE", phone: "(559) 555-0102", last_updated: "2026-09-10T00:00:00Z", lat: 36.8082, lng: -119.8318, slug: "fig-garden-care" },
      { id: 3, name: "Central Valley Retreat", address: "7890 E Olive Ave, Fresno, CA 93720", beds_available: 1, care_level: "RCFE", phone: "(559) 555-0103", last_updated: "2026-09-10T00:00:00Z", lat: 36.7712, lng: -119.7451, slug: "central-valley-retreat" }
    ];

    const map = L.map("map").setView([36.7378, -119.7871], 12);
    const markerLayer = L.layerGroup().addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const markerClass = `
      <style>
        .facility-card { pointer-events: auto; cursor: pointer; }
        .thelo-pin {
          width: 18px;
          height: 18px;
          border-radius: 9999px;
          border: 3px solid white;
          box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.35);
        }
        .thelo-pin.available { background: #34d399; }
        .thelo-pin.full { background: #94a3b8; }
      </style>
    `;
    document.head.insertAdjacentHTML("beforeend", markerClass);

    const greenIcon = L.divIcon({ html: '<div class="thelo-pin available"></div>', className: "", iconSize: [18, 18], iconAnchor: [9, 9] });
    const grayIcon = L.divIcon({ html: '<div class="thelo-pin full"></div>', className: "", iconSize: [18, 18], iconAnchor: [9, 9] });

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatUpdated(value) {
      if (!value) return "Unknown";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
    }

    function normalizeFacility(facility, index) {
      return {
        id: String(facility.id || facility.slug || facility.name || facility.facilityName || `facility-${index + 1}`),
        slug: String(facility.slug || facility.id || ""),
        name: facility.name || facility.facilityName || "Unknown facility",
        address: facility.address || "Address unavailable",
        beds_available: Number(facility.beds_available ?? facility.availableBeds ?? 0),
        care_level: facility.care_level || facility.careLevel || "RCFE",
        phone: facility.phone || "",
        last_updated: facility.last_updated || facility.updatedAt || "",
        lat: Number(facility.lat ?? [36.7378, 36.8082, 36.7712][index] ?? 36.7378),
        lng: Number(facility.lng ?? [-119.7871, -119.8318, -119.7451][index] ?? -119.7871)
      };
    }

    function normalizeFacilities(items) {
      const source = Array.isArray(items) ? items : items?.facilities || demoFacilities;
      return source.map(normalizeFacility);
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Request failed: ${url}`);
      return response.json();
    }

    async function fetchFirst(urls) {
      let lastError = new Error("No facility source available");
      for (const url of urls) {
        try {
          return await fetchJson(url);
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError;
    }

    window.openFacility = function(id) {
      console.log("open", id);
      const f = window.facilities.find((x) => String(x.id) === String(id));
      if (!f) return alert("facility not found " + id);
      document.getElementById("modalName").innerText = f.name || "";
      document.getElementById("modalAddress").innerText = f.address || "";
      document.getElementById("modalBeds").innerText = f.beds_available ?? "";
      document.getElementById("modalCare").innerText = f.care_level || "";
      document.getElementById("modalPhone").innerText = f.phone || "";
      document.getElementById("modalPhone").href = "tel:" + (f.phone || "");
      document.getElementById("modalUpdated").innerText = f.last_updated || "";
      document.getElementById("callBtn").href = "tel:" + (f.phone || "");
      const modal = document.getElementById("facilityModal");
      modal.classList.remove("hidden");
      modal.setAttribute("aria-hidden", "false");
    };

    function closeFacility() {
      const modal = document.getElementById("facilityModal");
      modal.classList.add("hidden");
      modal.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeFacilityModal").addEventListener("click", closeFacility);
    document.getElementById("facilityModal").addEventListener("click", (event) => {
      if (event.target.id === "facilityModal") closeFacility();
    });

    async function fetchFacilities() {
      try {
      const facilities = normalizeFacilities(await fetchFirst(FACILITIES_API_URLS));
      window.facilities = facilities;
      return facilities;
      } catch (_) {
      try {
        const facilities = normalizeFacilities(await fetchJson("/data/availability.json"));
        window.facilities = facilities;
        return facilities;
      } catch (_) {
        window.facilities = demoFacilities;
        return demoFacilities;
      }
      }
    }

    function renderFacilities(facilities) {
      window.facilities = facilities;
      markerLayer.clearLayers();
      const list = document.getElementById("facilityList");
      list.innerHTML = facilities.map((facility) => `
      <div onclick="window.openFacility('${escapeHtml(facility.id)}')" class="facility-card cursor-pointer pointer-events-auto rounded-2xl border border-white/10 bg-slate-950/80 p-4">
        <div class="flex items-center justify-between gap-3">
          <h2 class="font-semibold text-white">${escapeHtml(facility.name)}</h2>
          <span class="rounded-full px-3 py-1 text-xs font-bold ${facility.beds_available > 0 ? "bg-emerald-400 text-slate-950" : "bg-slate-600 text-white"}">${facility.beds_available > 0 ? "Available" : "Full"}</span>
        </div>
        <p class="mt-2 text-sm text-slate-300">${escapeHtml(facility.address)}</p>
        <p class="mt-1 text-sm text-slate-300">${facility.beds_available} beds open • ${escapeHtml(facility.care_level)} • ${escapeHtml(facility.phone || "Phone unavailable")}</p>
        <p class="mt-1 text-xs text-slate-500">Updated ${escapeHtml(formatUpdated(facility.last_updated))}</p>
      </div>
      `).join("");

      facilities.forEach((facility) => {
      const marker = L.marker([facility.lat, facility.lng], {
        icon: facility.beds_available > 0 ? greenIcon : grayIcon
      }).addTo(markerLayer);
      marker.on("click", () => window.openFacility(facility.id));
      marker.bindPopup(`
        <div class="space-y-2">
          <strong>${escapeHtml(facility.name)}</strong>
            <div>${escapeHtml(facility.address)}</div>
            <div>${facility.beds_available} beds open • ${escapeHtml(facility.care_level)}</div>
            <div>${escapeHtml(facility.phone || "Phone unavailable")}</div>
          </div>
        `);
      });
    }
    fetchFacilities().then(renderFacilities);
  </script>
</body>
</html>
