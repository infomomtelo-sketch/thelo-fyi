<script>
let facilities = [];
const FALLBACK = [
  {id:"1",name:"Fresno Assisted Living",address:"123 N Fresno St, Fresno, CA",lat:36.7378,lng:-119.7871,beds_available:3,care_level:"Assisted Living",phone:"5595550100",last_updated:"2026-05-10"}
];

function openFacility(id){
 const f = facilities.find(x=>String(x.id)===String(id));
 if(!f){console.error('not found',id);return;}
 document.getElementById('modalName').textContent=f.name||'';
 document.getElementById('modalAddress').textContent=f.address||'';
 document.getElementById('modalBeds').textContent=f.beds_available??'';
 document.getElementById('modalCare').textContent=f.care_level||f.care_type||'';
 document.getElementById('modalPhone').textContent=f.phone||'No phone listed';
 document.getElementById('modalUpdated').textContent=f.last_updated||f.updated_at||'';
 document.getElementById('callBtn').href=f.phone?`tel:${f.phone}`:'#';
 document.getElementById('facilityModal').classList.remove('hidden');
 window.facilities=facilities;
}

async function loadFacilities(){
 const urls=['./facilities.json','../facilities.json','/facilities.json'];
 for(const url of urls){
  try{
   const res=await fetch(url,{cache:'no-store'});
   const text=await res.text();
   console.log(url, res.status, text.slice(0,80));
   if(!res.ok) continue;
   if(text.trim().startsWith('<')) continue;
   const data=JSON.parse(text);
   facilities=data.facilities||data;
   renderCards(facilities); renderMarkers(facilities);
   return;
  }catch(e){console.warn('fail',url,e)}
 }
 console.log('using FALLBACK');
 facilities=FALLBACK;
 renderCards(facilities); renderMarkers(facilities);
}
</script>
