<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thelo Referral</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-5xl px-6 py-12">
    <div class="rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl shadow-sky-950/40">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <p class="text-sm uppercase tracking-[0.2em] text-slate-400">Thelo Verified</p>
          <h1 id="facilityName" class="mt-3 text-4xl font-black text-white">Loading facility...</h1>
        </div>
        <span id="verifiedBadge" class="rounded-full bg-emerald-400 px-5 py-3 text-sm font-black text-slate-950">Verified PASS</span>
      </div>

      <div class="mt-8 grid gap-8 lg:grid-cols-[1.2fr,0.8fr]">
        <section>
          <div class="flex flex-wrap gap-3">
            <span class="rounded-full border border-emerald-300/30 bg-emerald-300/10 px-4 py-2 text-sm font-semibold text-emerald-100">Available Now</span>
            <span id="priceBadge" class="rounded-full border border-white/10 bg-slate-900 px-4 py-2 text-sm font-semibold text-slate-200">$3500/mo</span>
            <span id="bedsBadge" class="rounded-full border border-white/10 bg-slate-900 px-4 py-2 text-sm font-semibold text-slate-200">2 beds</span>
          </div>
          <p id="summary" class="mt-6 text-lg leading-8 text-slate-300">Referral-ready RCFE inventory in Fresno.</p>
          <div class="mt-8 rounded-3xl border border-white/10 bg-slate-950/70 p-6">
            <h2 class="text-xl font-bold text-white">Room sizes</h2>
            <div id="rooms" class="mt-4 space-y-3"></div>
          </div>
        </section>

        <aside class="rounded-3xl border border-white/10 bg-slate-950/70 p-6">
          <p class="text-sm uppercase tracking-[0.2em] text-slate-400">Contact</p>
          <a href="tel:+15595550199" class="mt-4 inline-flex rounded-full bg-sky-400 px-6 py-3 text-sm font-bold text-slate-950">Call</a>
          <div class="mt-6 space-y-3 text-sm text-slate-300">
            <p id="locationText">Fresno, CA</p>
            <p id="complianceText">Title 22 status: PASS §87307</p>
          </div>
          <p class="mt-10 text-xs uppercase tracking-[0.2em] text-slate-500">Powered by Thelo</p>
        </aside>
      </div>
    </div>
  </main>

  <script>
    const demoFacility = {
      facilityName: "Fresno RCFE",
      slug: "fresno-rcfe",
      totalBeds: 2,
      availableBeds: 2,
      price: 3500,
      lat: 36.7378,
      lng: -119.7871,
      complianceStatus: "PASS",
      rooms: [
        { name: "Primary Suite", beds: 1, sqft: 110, requiredSqft: 80, status: "PASS" },
        { name: "Garden Room", beds: 1, sqft: 96, requiredSqft: 80, status: "PASS" }
      ]
    };

    async function fetchFacility(slug) {
      if (!slug) return demoFacility;
      try {
        const response = await fetch(`https://api.thelo.fyi/api/facility?slug=${encodeURIComponent(slug)}`);
        if (!response.ok) throw new Error("Request failed");
        const data = await response.json();
        return data.facility || demoFacility;
      } catch (_) {
        return demoFacility;
      }
    }

    function renderFacility(facility) {
      document.getElementById("facilityName").textContent = facility.facilityName;
      document.getElementById("priceBadge").textContent = `$${Number(facility.price || 0).toLocaleString()}/mo`;
      document.getElementById("bedsBadge").textContent = `${facility.availableBeds || facility.totalBeds || 0} beds available`;
      document.getElementById("summary").textContent = `${facility.facilityName} in Fresno with verified room measurements and live bed availability.`;
      document.getElementById("locationText").textContent = `Fresno, CA • ${facility.lat}, ${facility.lng}`;
      document.getElementById("complianceText").textContent = `Title 22 status: ${facility.complianceStatus || "PASS"} §87307`;
      const badge = document.getElementById("verifiedBadge");
      badge.textContent = `Verified ${facility.complianceStatus || "PASS"}`;
      badge.className = `rounded-full px-5 py-3 text-sm font-black ${facility.complianceStatus === "FAIL" ? "bg-rose-400 text-slate-950" : "bg-emerald-400 text-slate-950"}`;

      const rooms = facility.rooms && facility.rooms.length ? facility.rooms : demoFacility.rooms;
      document.getElementById("rooms").innerHTML = rooms.map((room) => `
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <div class="flex items-center justify-between gap-4">
            <p class="font-semibold text-white">${room.name}</p>
            <span class="rounded-full ${room.status === "FAIL" ? "bg-rose-400" : "bg-emerald-400"} px-3 py-1 text-xs font-bold text-slate-950">${room.status}</span>
          </div>
          <p class="mt-2 text-sm text-slate-300">${room.sqft} sq ft • ${room.beds} bed(s) • needs ${room.requiredSqft} sq ft</p>
        </div>
      `).join("");
    }

    const slug = new URLSearchParams(window.location.search).get("f");
    fetchFacility(slug).then(renderFacility);
  </script>
</body>
</html>
